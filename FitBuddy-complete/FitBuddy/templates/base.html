<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "FitBuddy" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
<header class="site-header">
    <a class="brand" href="/">FitBuddy</a>
    <nav>
        <a href="/">Create plan</a>
        <a href="/view-all-users">Admin view</a>
        <a href="/docs">API docs</a>
    </nav>
</header>

<main class="container">
    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    <p>FitBuddy provides general wellness information and is not a substitute for professional medical advice.</p>
</footer>
</body>
</html>
